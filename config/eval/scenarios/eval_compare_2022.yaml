# Eval after benchmark with LoRA anchor year_max=2022 (years 2023-2025).
db_path: data/neurolink.db
test_years: [2023, 2024, 2025]
top_k: [10, 50]
models:
  - literature_lora
  - mistral_base
  - braingpt
semantic_threshold: 0.55
critical_only: false
predict_config: config/forecast/predict_compare.yaml
lora_year_max: 2022
brainbench_enabled: true
contamination_enabled: true
brainbench_max_pairs: 50
contamination_corpus_sample: 200
