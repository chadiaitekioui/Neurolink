# Eval LoRA-only predict 2026 (adapter year_max_2025).
db_path: data/neurolink.db
test_years: [2026]
top_k: [10, 50]
models:
  - literature_lora
semantic_threshold: 0.50
matcher_backend: minilm
embed_model: sentence-transformers/all-MiniLM-L6-v2
critical_only: true
filter_gt_noise: true
min_pred_coverage: 0.5
predict_config: config/forecast/scenarios/predict_2026.yaml
brainbench_enabled: true
contamination_enabled: true
brainbench_max_pairs: 50
contamination_corpus_sample: 200
