# Reference protocol — hyperparameters and eval defaults for reproducible runs.
# Not loaded automatically by the pipeline; mirror these values in forecast/eval YAMLs.
# See Protocol.md for the full experimental protocol.

db_path: data/neurolink.db

test_years: [2018, 2019, 2020, 2021, 2022, 2023, 2024]
critical_percentile: 0.90
top_k: [10, 50, 100]
semantic_threshold: 0.50
matcher_backend: minilm
embed_model: sentence-transformers/all-MiniLM-L6-v2

emergence_weights:
  growth: 0.35
  novelty: 0.25
  atypicality: 0.25
  semantic_shift: 0.15

seed: 42
