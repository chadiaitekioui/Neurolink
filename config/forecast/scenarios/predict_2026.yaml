# Predict + eval 2026 with LoRA trained through 2025 (standard year_max = N-1).
db_path: data/neurolink.db
test_years: [2026]
top_k: [10, 50]
models:
  - literature_lora
seed: 42
literature:
  adapter_dir: data/models/literature
  max_context_questions: 30
  backend: lora
  use_4bit: true
  braingpt_model: BrainGPT/BrainGPT-7B-v0.2
  training_prompt_k: 1
  generation_mode: iterative
  filter_outputs: true
  reject_context_copies: true
  llm:
    max_new_tokens: 96
    tokens_per_direction: 48
    temperature: 0.0
    top_p: 1.0
    seed: 42
