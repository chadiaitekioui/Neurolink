# Inference 2027: LoRA frozen at year_max_2025, context includes partial 2026 (N-1).
# No ground truth for 2027 — predict only, no eval.
db_path: data/neurolink.db
test_years: [2027]
top_k: [10, 50]
models:
  - literature_lora
seed: 42
literature:
  adapter_dir: data/models/literature
  benchmark_lora_year_max: 2025
  max_context_questions: 40
  backend: lora
  use_4bit: true
  braingpt_adapter: BrainGPT/BrainGPT-7B-v0.2
  training_prompt_k: 1
  llm:
    max_new_tokens: 96
    temperature: 0.0
    top_p: 1.0
    seed: 42
