# Quick generation smoke before full Job-2 benchmark.
# Same inference knobs as predict_compare (sampling, pool, near-dedup, soft truncate).
# Year 2023 only, k=10 — inspect eval/gen_smoke_*.json then launch bench22.
db_path: data/neurolink.db
test_years: [2023]
top_k: 10
models:
  - literature_lora
  - mistral_base
  - braingpt
# If literature_instruct/year_max_2022/lora exists, the runner also smoke-tests it.
include_instruct_if_present: true
output_dir: eval
literature:
  adapter_dir: data/models/literature_base
  base_model: mistralai/Mistral-7B-v0.1
  prompt_style: continuation
  braingpt_model: BrainGPT/BrainGPT-7B-v0.2
  max_context_questions: 30
  context_year_max: 2022
  backend: lora
  use_4bit: true
  benchmark_lora_year_max: 2022
  generation_mode: iterative
  filter_outputs: true
  reject_context_copies: true
  max_generation_attempts_factor: 2.0
  pool_factor: 3.0
  soft_truncate_words: true
  max_direction_words: 25
  reject_near_duplicates: true
  near_duplicate_threshold: 0.85
  semantic_threshold: 0.50
  matcher_backend: minilm
  embed_model: sentence-transformers/all-MiniLM-L6-v2
  llm:
    max_new_tokens: 96
    tokens_per_direction: 48
    temperature: 0.7
    top_p: 0.9
    seed: 42
    num_return_sequences: 3
