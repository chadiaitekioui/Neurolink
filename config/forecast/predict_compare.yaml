db_path: data/neurolink.db
# test_years inferred at runtime: all question years strictly after the chosen LoRA year_max
test_years: []
top_k: [10, 50]
models:
  - literature_lora
  - mistral_base
  - braingpt
seed: 42
literature:
  adapter_dir: data/models/literature
  braingpt_model: BrainGPT/BrainGPT-7B-v0.2
  max_context_questions: 40
  backend: lora
  use_4bit: true
  train_epochs: 1
  train_lr: 0.0001
  train_fraction: 0.7
  max_examples_per_year: 0
  error_train_epochs: 2
  error_max_examples: 50
  semantic_threshold: 0.55
  error_critical_only: true
  training_prompt_k: 1
  llm:
    max_new_tokens: 96
    temperature: 0.0
    top_p: 1.0
    seed: 42
