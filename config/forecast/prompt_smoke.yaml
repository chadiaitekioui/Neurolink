# Parallel prompt smoke (does NOT replace predict_compare / Job 2).
# Same prompt as train/predict: Year N (30 articles) → Year N+1.
# Models: mistral_base + braingpt. Output: eval/prompt_smoke_*.json
db_path: data/neurolink.db
test_years: [2023]
top_k: 10
eval_top_k: [10]
models:
  - mistral_base
  - braingpt
filter_outputs: true
reject_context_copies: true
max_generation_attempts_factor: 2.0
output_dir: eval
semantic_threshold: 0.50
matcher_backend: minilm
embed_model: sentence-transformers/all-MiniLM-L6-v2
critical_only: true
filter_gt_noise: true
min_pred_coverage: 0.5
contamination_enabled: true
contamination_corpus_sample: 200
literature:
  adapter_dir: data/models/literature
  braingpt_model: BrainGPT/BrainGPT-7B-v0.2
  max_context_questions: 30
  # Explicit: context year N=2022 when predicting 2023.
  context_year_max: 2022
  use_4bit: true
  generation_mode: iterative
  filter_outputs: true
  reject_context_copies: true
  semantic_threshold: 0.50
  matcher_backend: minilm
  embed_model: sentence-transformers/all-MiniLM-L6-v2
  llm:
    max_new_tokens: 96
    tokens_per_direction: 48
    temperature: 0.7
    top_p: 0.9
    seed: 42
    num_return_sequences: 3
