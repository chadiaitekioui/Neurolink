# Parallel prompt-v2 smoke (does NOT replace predict_compare / Job 2).
# Models: mistral_base + braingpt only. Output: eval/prompt_smoke_*.json
db_path: data/neurolink.db
test_years: [2023]
top_k: 10
models:
  - mistral_base
  - braingpt
filter_outputs: true
reject_context_copies: true
max_generation_attempts_factor: 2.0
output_dir: eval
literature:
  adapter_dir: data/models/literature
  braingpt_model: BrainGPT/BrainGPT-7B-v0.2
  max_context_questions: 20
  use_4bit: true
  generation_mode: iterative
  filter_outputs: true
  reject_context_copies: true
  llm:
    max_new_tokens: 96
    tokens_per_direction: 48
    temperature: 0.7
    top_p: 0.9
    seed: 42
    num_return_sequences: 3
